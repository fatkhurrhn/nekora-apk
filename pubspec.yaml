name: nekora
description: Media sosial khusus kucing

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/jetbrainsmono.ttf
          weight: 400
        - asset: assets/jetbrainsmono.ttf
          weight: 500